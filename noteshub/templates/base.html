<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Noteshub{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css').path }}">
  {% block scripts %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Noteshub <span>阅读笔记</span></a>
    {% if session %}
    <form action="/logout" method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="quiet" type="submit">退出登录</button>
    </form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>个人阅读笔记工作台</footer>
</body>
</html>

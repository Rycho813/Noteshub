{% extends 'base.html' %}
{% block title %}登录 · Noteshub{% endblock %}
{% block content %}
<section class="panel login">
  <p class="eyebrow">欢迎回来</p>
  <h1>登录阅读笔记</h1>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ login_csrf }}">
    <label>用户名<input name="username" autocomplete="username" required maxlength="100" autofocus></label>
    <label>密码<input type="password" name="password" autocomplete="current-password" required maxlength="1024"></label>
    <button type="submit">登录</button>
  </form>
</section>
{% endblock %}
